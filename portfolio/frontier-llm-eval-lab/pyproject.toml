[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-llm-eval-lab"
version = "0.1.0"
description = "Transparent rubric-based LLM evaluation baseline"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
frontier-eval = "frontier_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
